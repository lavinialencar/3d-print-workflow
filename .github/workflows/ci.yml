name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest,  python: "3.12" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the optional dependency (numpy, for the part analyzer)
        # Exact versions: 1.24.4 is the last numpy for Python 3.8 (wheels up to 3.11); 2.5.3 needs 3.12+.
        run: python -m pip install "numpy==1.24.4; python_version < '3.12'" "numpy==2.5.3; python_version >= '3.12'"
      - name: Compile every script
        run: python -m py_compile scripts/*.py tools/*.py
      - name: Unit tests (synthetic data only)
        run: python -m unittest discover -s tests -v

  personal-data:
    name: no personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Shape-based scan (IPs, MACs, e-mails, home paths, topics)
        run: python3 tools/scan_personal_data.py

  links:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every relative link and anchor resolves
        run: python3 tools/check_links.py

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
