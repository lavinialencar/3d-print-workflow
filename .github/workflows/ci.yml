name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest,  python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every script
        run: python -m py_compile scripts/*.py tools/*.py
      - name: Unit tests (synthetic data only)
        run: python -m unittest discover -s tests -v

  personal-data:
    name: no personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shape-based scan (IPs, MACs, e-mails, home paths, topics)
        run: python3 tools/scan_personal_data.py

  links:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every relative link and anchor resolves
        run: python3 tools/check_links.py

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
